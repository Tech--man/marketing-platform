server:
  port: 8081

spring:
  application:
    name: marketing-activity
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DB:marketing_activity}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:marketing}
    password: ${MYSQL_PASSWORD:marketing123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        # local 模式整体关闭 nacos 配置客户端：否则它常驻一条 gRPC 重连线程，
        # 每 3s 刷一次 "Server check fail"，并把 /actuator/health 拖成 DOWN
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        # local 模式不从 nacos 导入配置，关闭 starter 的强制导入检查
        import-check:
          enabled: false

mybatis-plus:
  # 这里刻意不配逻辑删除：所有表都没有 deleted 列，配了它只会让 deleteById 静默变成物理删除；
  # 下线语义一律走各自的 status（活动 OFFLINE/FINISHED、券模板 OFFLINE、规则 DISABLED）。
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# 在线配置下发：灰度真值已从这里的 marketing.gray 搬进 activity.gray_percent/gray_whitelist 列
# （yml 那份既改不动——全仓零 @RefreshScope，也要在重启后漂走；见 2026-09-23 段内 spec §3 偏离 3）
marketing:
  config:
    form: ${DEPLOY_FORM:}
    poll-seconds: ${CONFIG_POLL_SECONDS:5}
  gray:
    # 灰度规则的刷新节拍；真值在 DB 列，这里只调回源频率
    refresh-seconds: ${GRAY_REFRESH_SECONDS:5}

logging:
  level:
    com.example.marketing: INFO

---
spring:
  config:
    import: optional:nacos:marketing-activity.yaml
    activate:
      on-profile: nacos
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
