server:
  port: 8090   # 宿主机 8080 常被其他服务占用，网关默认 8090

spring:
  application:
    name: marketing-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        # 默认 local 模式静态路由；--spring.profiles.active=nacos 切换为服务发现 + lb:// 路由
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      # XFF 治理（H3，2026-09-29 架构审查）：网关是最外层入口，客户端自报的
      # X-Forwarded-For / X-Real-IP 一律不可信。for-append=false 让网关把 XFF
      # **覆写**为自己看到的对端地址再转发（SCG 默认是追加，伪造值会原样带到下游，
      # 被 ClientIp 取首段采信——限速、登录限流、审计 IP 全部可被一个请求头穿透）。
      # 下游因此拿到的 XFF 恒为网关写入的单值。将来前面真加一层可信 LB 时，
      # 在那层写 XFF 并在这里按跳数取段，而不是恢复追加。
      x-forwarded:
        for-append: false
      httpclient:
        # 上游超时（2026-09-29 审查第四批）：SCG/Reactor-Netty 默认 response 超时是**无限**——
        # 任何上游 hang 住都会无限期占用客户端连接与事件循环。connect 2s / response 10s
        # 覆盖除 BCrypt 登录（~100ms）外全部路径；超时走 5xx 兜底页而不是连接悬置。
        connect-timeout: ${GW_CONNECT_TIMEOUT:2000}
        response-timeout: ${GW_RESPONSE_TIMEOUT:10s}
        pool:
          # 上游 Tomcat 空闲 61.3s 主动关连接（实测，见 README"已知噪音"），而 reactor-netty
          # 默认既不设 max-idle-time 也不开后台清理（eviction-interval 默认 0）——池里的连接
          # 可能比上游活得久，复用到一条已被对端 FIN 掉的连接就抛 PrematureCloseException，
          # 表现为 500。让客户端先退役，这个窗口就不存在。
          max-idle-time: ${GW_POOL_MAX_IDLE:30s}
          eviction-interval: ${GW_POOL_EVICT_INTERVAL:10s}
      routes:
        - id: activity-route
          uri: http://${ACTIVITY_HOST:127.0.0.1}:${ACTIVITY_PORT:8081}
          predicates:
            - Path=/api/activity/**
        - id: coupon-route
          uri: http://${COUPON_HOST:127.0.0.1}:${COUPON_PORT:8082}
          predicates:
            - Path=/api/coupon/**
        - id: discount-route
          uri: http://${DISCOUNT_HOST:127.0.0.1}:${DISCOUNT_PORT:8083}
          predicates:
            - Path=/api/discount/**
        - id: seckill-route
          uri: http://${SECKILL_HOST:127.0.0.1}:${SECKILL_PORT:8084}
          predicates:
            - Path=/api/seckill/**
        # ③：业务管理面的写端点长在 owning 服务上，但路径统一在 /api/admin/ 前缀下。
        # 这四条**必须排在下面那条 admin-route 之前**：网关按声明顺序取第一个命中的路由，
        # 而 admin-route 的 /api/admin/** 会把它们整片吞掉（表现是"后台改预算永远打到 admin 进程"）。
        # LITE 下这四条与 admin-route 同指 standalone:8085（compose 已把四个 *_HOST/*_PORT 指过去）。
        - id: admin-activity-route
          uri: http://${ACTIVITY_HOST:127.0.0.1}:${ACTIVITY_PORT:8081}
          predicates:
            - Path=/api/admin/activities/**
        - id: admin-coupon-route
          uri: http://${COUPON_HOST:127.0.0.1}:${COUPON_PORT:8082}
          predicates:
            - Path=/api/admin/coupon/**
        - id: admin-discount-route
          uri: http://${DISCOUNT_HOST:127.0.0.1}:${DISCOUNT_PORT:8083}
          predicates:
            - Path=/api/admin/discount/**
        - id: admin-seckill-route
          uri: http://${SECKILL_HOST:127.0.0.1}:${SECKILL_PORT:8084}
          predicates:
            - Path=/api/admin/seckill/**
        # 管理后台：LITE 下 ADMIN_HOST=standalone、ADMIN_PORT=8085（同一进程），
        # 默认值是 FULL 进程形态的独立 admin:8086
        - id: admin-route
          uri: http://${ADMIN_HOST:127.0.0.1}:${ADMIN_PORT:8086}
          predicates:
            - Path=/api/admin/**
        # ⑥ 的后台界面。与 admin-route 共用同一对占位符是刻意的：LITE 下 compose 把它们
        # 指到 standalone:8085、FULL 进程档指到 127.0.0.1:8086、容器档指到 marketing-admin:8086，
        # 单独写死一个地址就等于五套入口里总有一套打不开界面。
        - id: ui-route
          uri: http://${ADMIN_HOST:127.0.0.1}:${ADMIN_PORT:8086}
          predicates:
            - Path=/ui/**
        # C 端 H5：与 ui-route 共用同一对占位符（静态资源同样长在 admin/standalone 里）。
        # 漏这条的后果和当年漏 ui-route 一样：LITE 能开、升 FULL 整片 404。
        - id: h5-route
          uri: http://${ADMIN_HOST:127.0.0.1}:${ADMIN_PORT:8086}
          predicates:
            - Path=/h5/**
        # 消费者账号服务：注册/登录/刷新/会话。必须排在 admin-route 之前吗？不必 ——
        # 它的路径是 /api/auth/**，与 /api/admin/** 不重叠，四条 admin 业务写路由也不吃它。
        - id: account-route
          uri: http://${ACCOUNT_HOST:127.0.0.1}:${ACCOUNT_PORT:8087}
          predicates:
            - Path=/api/auth/**

marketing:
  # 在线配置的形态标识与轮询节拍由 common 的嵌套占位统一读 DEPLOY_FORM / CONFIG_POLL_SECONDS，
  # 不在这里复制一份（同 marketing.* 的单一来源口径）
  gateway:
    # 演示级静态 token 那一层已经删除（AuthFilter）：一枚所有人共用的 token 不提供任何
    # 认证，只是把"未登录"这件事藏起来。C 端身份一律走下面的 consumer JWT。
    # /ui/** 与 /h5/** 不需要再列白名单 —— 它们不在 /api/** 下，天然不被托管。
    # 分层限流·网关层：按路由配置滑动窗口阈值（秒杀最严格，超限返回排队码）
    rate-limit:
      # 阈值随形态给（默认值即 FULL 口径）。LITE 单机实测异步排空约 110-140 msg/s/topic，
      # 所以服役档把"会进队列"的两条路收到 ≈120/s：接得进来就要消化得掉，
      # 否则只是把洪流换成排队，还会把 Redis Stream 顶到 maxmemory 后触发退避。
      activity-route:
        limit: ${RL_ACTIVITY:500}
        window-seconds: 1
      coupon-route:
        limit: ${RL_COUPON:1000}
        window-seconds: 1
      discount-route:
        limit: ${RL_DISCOUNT:2000}
        window-seconds: 1
      seckill-route:
        limit: ${RL_SECKILL:200}
        window-seconds: 1
      # 后台单独一桶：50/s 的上限来自 BCrypt —— 单次口令校验 50-100ms 且在网关之后，
      # 没有这一条，脚本化撞库只需要几十 QPS 就能把 admin 进程的 CPU 吃满，
      # 而它和 C 端同进程时会连带影响服役档业务。route id 不在 map 里=完全不限流。
      admin-route:
        limit: ${RL_ADMIN:50}
        window-seconds: 1
      # ③ 的四条业务后台路由各占一桶。50/s 与 admin-route 同档：这些是低频写，
      # 而且后台登录口那条理由（BCrypt 50-100ms 吃 CPU）同样适用于它们背后的账号校验。
      # 不在 map 里=完全不限流且不报错，所以这四条与路由本身同等重要。
      admin-activity-route:
        limit: ${RL_ADMIN_ACTIVITY:50}
        window-seconds: 1
      admin-coupon-route:
        limit: ${RL_ADMIN_COUPON:50}
        window-seconds: 1
      admin-discount-route:
        limit: ${RL_ADMIN_DISCOUNT:50}
        window-seconds: 1
      admin-seckill-route:
        limit: ${RL_ADMIN_SECKILL:50}
        window-seconds: 1
      # ⑥ 的界面。首屏十几个请求（js/css/字体），100/s 掐不到正常打开，
      # 但挡住了"把后台 jar 当文件服务器刷"。不在 map 里 = 不限流且不报错。
      ui-route:
        limit: ${RL_UI:100}
        window-seconds: 1
      # C 端 H5 的界面：与后台同档，首屏十几个请求正常打开，挡住把 jar 当文件服务器刷。
      h5-route:
        limit: ${RL_H5:100}
        window-seconds: 1
      # 账号服务单独一桶，阈值与 admin-route 同源的一条理由但更紧：BCrypt 单次 50-100ms
      # 且在网关之后，脚本化撞库只需几十 QPS 就能把 account 进程的 CPU 吃满；
      # 而 LITE 下它与四个业务服务同 JVM，会连带拖垮服役档的交易入口。
      # 登录口的每 IP 细粒度限速在 account 服务内部（ConsumerLoginGuard），两层不同职责。
      account-route:
        limit: ${RL_ACCOUNT:20}
        window-seconds: 1

    admin:
      # 与 admin 服务同值；留空=后台整片 40300，C 端不受影响（见 AdminAuthFilter）
      jwt-secret: ${ADMIN_JWT_SECRET:}
      clock-skew-seconds: 30
    consumer:
      # 与 account 服务同值，且必须是**另一个**值：一把密钥两种用途，
      # 后台 token 就能被消费者侧接受，"两套凭证不互通"只剩 claim 形状的侥幸。
      # 留空 = 受保护的身份端点整片 40300，不影响后台与业务流量。
      jwt-secret: ${CONSUMER_JWT_SECRET:}
      clock-skew-seconds: 30
      # 托管整片 /api/**：要登录是默认，游客可看是例外。反过来写（逐条列需要登录的路径）
      # 的话，新增一条交易路由就默默免鉴权了。/api/admin/** 由 AdminAuthFilter 的
      # VERIFIED 标记让开，不靠这里排除。
      managed-paths:
        - /api/**
      # 免 access token 的口：判据是"游客本来就该看到"且"不落任何属于某个消费者的数据"。
      # 券的 stock 与秒杀的 stock 是两条公开余量读数；活动详情/秒杀列表是目录页。
      permit-paths:
        - /api/auth/login
        - /api/auth/register
        - /api/auth/refresh
        - /api/activity/*
        - /api/activity/*/participatable
        - /api/activity/*/budget/remain
        - /api/coupon/stock/*
        - /api/seckill/activities
        - /api/seckill/stock/*

management:
  # 管理端口与业务入口分离（2026-09-29 架构审查）：actuator 原先与 8090 同端口对外，
  # /actuator/prometheus 会把全部路由与上游 URI 标签、限流拒绝计数挂在公网入口上，
  # 等于内部拓扑测绘的原料。8091 不进 compose 的对外发布（进程形态下回环调试仍可用），
  # ④ 的运维代理、prometheus、脚本的 /actuator/health 均已同步改指 8091。
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.marketing: INFO

---
# nacos profile：注册中心模式，路由改经服务发现（uri 用 lb://，同名服务多实例自动负载均衡）
spring:
  config:
    activate:
      on-profile: nacos
  cloud:
    nacos:
      discovery:
        enabled: true
    gateway:
      routes:
        - id: activity-route
          uri: lb://marketing-activity
          predicates: [ Path=/api/activity/** ]
        - id: coupon-route
          uri: lb://marketing-coupon
          predicates: [ Path=/api/coupon/** ]
        - id: discount-route
          uri: lb://marketing-discount
          predicates: [ Path=/api/discount/** ]
        - id: seckill-route
          uri: lb://marketing-seckill
          predicates: [ Path=/api/seckill/** ]
        # ③ 的四条：与 local 段一起改。漏这条的表现和 local 漏 nacos 一样阴——
        # LITE 一切正常，只有升档后后台写整片 404。
        - id: admin-activity-route
          uri: lb://marketing-activity
          predicates: [ Path=/api/admin/activities/** ]
        - id: admin-coupon-route
          uri: lb://marketing-coupon
          predicates: [ Path=/api/admin/coupon/** ]
        - id: admin-discount-route
          uri: lb://marketing-discount
          predicates: [ Path=/api/admin/discount/** ]
        - id: admin-seckill-route
          uri: lb://marketing-seckill
          predicates: [ Path=/api/admin/seckill/** ]
        # 必须和上面 local 那段一起改：漏这条的表现是 FULL 形态后台整片 404，
        # 而 LITE 一切正常——只在升档后才暴露。
        - id: admin-route
          uri: lb://marketing-admin
          predicates: [ Path=/api/admin/** ]
        # 与上面 local 段那条 ui-route 成对：漏这条，LITE 打开后台一切正常，
        # 升到 FULL 就是整片 404（③ 已经为 admin-route 交过一次这个学费）。
        - id: ui-route
          uri: lb://marketing-admin
          predicates: [ Path=/ui/** ]
        # 与上面 local 段那条 h5-route 成对：漏这条，LITE 打开 H5 一切正常，升到 FULL 整片 404。
        - id: h5-route
          uri: lb://marketing-admin
          predicates: [ Path=/h5/** ]
        # 与上面 local 段那条 account-route 成对：漏这条，LITE 登录一切正常，
        # 升到 FULL 就是 /api/auth/** 整片 404（③ 与 ⑥ 各为这类漏项交过一次学费）。
        - id: account-route
          uri: lb://marketing-account
          predicates: [ Path=/api/auth/** ]
