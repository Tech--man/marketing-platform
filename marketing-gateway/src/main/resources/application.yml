server:
  port: 8090   # 宿主机 8080 常被其他服务占用，网关默认 8090

spring:
  application:
    name: marketing-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        # 默认 local 模式静态路由；--spring.profiles.active=nacos 切换为服务发现 + lb:// 路由
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      httpclient:
        pool:
          # 上游 Tomcat 空闲 61.3s 主动关连接（实测，见 README"已知噪音"），而 reactor-netty
          # 默认既不设 max-idle-time 也不开后台清理（eviction-interval 默认 0）——池里的连接
          # 可能比上游活得久，复用到一条已被对端 FIN 掉的连接就抛 PrematureCloseException，
          # 表现为 500。让客户端先退役，这个窗口就不存在。
          max-idle-time: ${GW_POOL_MAX_IDLE:30s}
          eviction-interval: ${GW_POOL_EVICT_INTERVAL:10s}
      routes:
        - id: activity-route
          uri: http://${ACTIVITY_HOST:127.0.0.1}:${ACTIVITY_PORT:8081}
          predicates:
            - Path=/api/activity/**
        - id: coupon-route
          uri: http://${COUPON_HOST:127.0.0.1}:${COUPON_PORT:8082}
          predicates:
            - Path=/api/coupon/**
        - id: discount-route
          uri: http://${DISCOUNT_HOST:127.0.0.1}:${DISCOUNT_PORT:8083}
          predicates:
            - Path=/api/discount/**
        - id: seckill-route
          uri: http://${SECKILL_HOST:127.0.0.1}:${SECKILL_PORT:8084}
          predicates:
            - Path=/api/seckill/**
        # 管理后台：LITE 下 ADMIN_HOST=standalone、ADMIN_PORT=8085（同一进程），
        # 默认值是 FULL 进程形态的独立 admin:8086
        - id: admin-route
          uri: http://${ADMIN_HOST:127.0.0.1}:${ADMIN_PORT:8086}
          predicates:
            - Path=/api/admin/**

marketing:
  # 在线配置下发：DEPLOY_FORM 未设置时只对 form=GLOBAL 的覆盖生效（行为与本段之前一致）
  config:
    form: ${DEPLOY_FORM:}
    poll-seconds: ${CONFIG_POLL_SECONDS:5}
  gateway:
    auth:
      enabled: true
      token: ${GATEWAY_TOKEN:demo-token-123}
    whitelist:
      - /actuator/**
    # 分层限流·网关层：按路由配置滑动窗口阈值（秒杀最严格，超限返回排队码）
    rate-limit:
      # 阈值随形态给（默认值即 FULL 口径）。LITE 单机实测异步排空约 110-140 msg/s/topic，
      # 所以服役档把"会进队列"的两条路收到 ≈120/s：接得进来就要消化得掉，
      # 否则只是把洪流换成排队，还会把 Redis Stream 顶到 maxmemory 后触发退避。
      activity-route:
        limit: ${RL_ACTIVITY:500}
        window-seconds: 1
      coupon-route:
        limit: ${RL_COUPON:1000}
        window-seconds: 1
      discount-route:
        limit: ${RL_DISCOUNT:2000}
        window-seconds: 1
      seckill-route:
        limit: ${RL_SECKILL:200}
        window-seconds: 1
      # 后台单独一桶：50/s 的上限来自 BCrypt —— 单次口令校验 50-100ms 且在网关之后，
      # 没有这一条，脚本化撞库只需要几十 QPS 就能把 admin 进程的 CPU 吃满，
      # 而它和 C 端同进程时会连带影响服役档业务。route id 不在 map 里=完全不限流。
      admin-route:
        limit: ${RL_ADMIN:50}
        window-seconds: 1

    admin:
      # 与 admin 服务同值；留空=后台整片 40300，C 端不受影响（见 AdminAuthFilter）
      jwt-secret: ${ADMIN_JWT_SECRET:}
      clock-skew-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.marketing: INFO

---
# nacos profile：注册中心模式，路由改经服务发现（uri 用 lb://，同名服务多实例自动负载均衡）
spring:
  config:
    activate:
      on-profile: nacos
  cloud:
    nacos:
      discovery:
        enabled: true
    gateway:
      routes:
        - id: activity-route
          uri: lb://marketing-activity
          predicates: [ Path=/api/activity/** ]
        - id: coupon-route
          uri: lb://marketing-coupon
          predicates: [ Path=/api/coupon/** ]
        - id: discount-route
          uri: lb://marketing-discount
          predicates: [ Path=/api/discount/** ]
        - id: seckill-route
          uri: lb://marketing-seckill
          predicates: [ Path=/api/seckill/** ]
        # 必须和上面 local 那段一起改：漏这条的表现是 FULL 形态后台整片 404，
        # 而 LITE 一切正常——只在升档后才暴露。
        - id: admin-route
          uri: lb://marketing-admin
          predicates: [ Path=/api/admin/** ]
