server:
  port: 8082

spring:
  application:
    name: marketing-coupon
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DB:marketing_coupon}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:marketing}
    password: ${MYSQL_PASSWORD:marketing123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      # 命令超时 3s（2026-09-29 审查收口）：lettuce 默认 60s——Redis 抖动时每个请求
      # 最长挂一分钟而不是快速失败；库存/限流/幂等全压在 Redis 上，快速失败 + 降级
      # （网关 fail-open、预算回删）比长悬挂便宜得多
      timeout: ${REDIS_TIMEOUT_MS:3000}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        # local 模式整体关闭 nacos 配置客户端：否则它常驻一条 gRPC 重连线程，
        # 每 3s 刷一次 "Server check fail"，并把 /actuator/health 拖成 DOWN
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        # local 模式不从 nacos 导入配置，关闭 starter 的强制导入检查
        import-check:
          enabled: false

mybatis-plus:
  # 这里刻意不配逻辑删除：所有表都没有 deleted 列，配了它只会让 deleteById 静默变成物理删除；
  # 下线语义一律走各自的 status（活动 OFFLINE/FINISHED、券模板 OFFLINE、规则 DISABLED）。
  global-config:
    banner: false

rocketmq:
  name-server: ${ROCKETMQ_ADDR:127.0.0.1:9876}
  producer:
    group: PID_MARKETING_COUPON

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

# C 端身份：业务服务不采信裸 X-User-Id 头，而是自己验网关透传的那枚签名 token。
# 这个属性缺失时 ConsumerRequestIdentity 这个 bean 会安静地缺席（它是 @ConditionalOnProperty
# 装的），拖到第一个登录请求才炸 —— 所以四个业务模块与 standalone 都要显式声明，
# 和 marketing.admin.jwt-secret 同一条口径。
marketing:
  # 启动期 schema 断言（2026-10-01 审计 P1-1）：本服务写 idempotent_record.claim_token，
  # 未迁移的既有卷缺列时启动即失败，而不是上线后第一批幂等写全线 Unknown column
  schema-guard:
    required-columns: idempotent_record.claim_token
  consumer:
    token-secret: ${CONSUMER_JWT_SECRET:}

logging:
  # W12：印网关注入的 traceId（无头直连时为空，日志照常）——跨服务排障的钥匙
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.example.marketing: INFO

---
spring:
  config:
    import: optional:nacos:marketing-coupon.yaml
    activate:
      on-profile: nacos
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
