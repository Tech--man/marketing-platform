server:
  port: 8086

spring:
  application:
    name: marketing-admin
  datasource:
    # ${MYSQL_DB:marketing_admin} —— 四库隔离档下是第 5 个库；
    # LITE/dev 单库档由 MYSQL_DB=marketing 覆盖，表并进业务库里（见 init-lite DDL）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DB:marketing_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:marketing}
    password: ${MYSQL_PASSWORD:marketing123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 后台 QPS 极低（人点出来的请求），5 条连接足够；和 C 端同进程时不给它抢池子的空间
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        import-check:
          enabled: false

mybatis-plus:
  # 与业务模块一致：不配逻辑删除，所有表都没有 deleted 列。
  # 后台的"删除"语义是停用（status=DISABLED）与会话吊销，不是抹行 —— 审计要留痕
  global-config:
    banner: false

marketing:
  # 在线配置：admin 既是唯一写方也是读方（配置页要显示"我这一档当前生效的是什么、跑在第几版"）。
  # 形态标识与节拍由 common 的嵌套占位统一读 DEPLOY_FORM / CONFIG_POLL_SECONDS，不在此复制
  admin:
    jwt-secret: ${ADMIN_JWT_SECRET:}
    access-ttl-seconds: ${ADMIN_TOKEN_TTL:900}
    clock-skew-seconds: 30
    max-fail-count: ${ADMIN_MAX_FAIL:5}
    lock-minutes: ${ADMIN_LOCK_MINUTES:15}
    # 登录口单独限速（网关的 RL_ADMIN 管的是整个后台，不是撞库）
    login-ip-limit: ${ADMIN_LOGIN_IP_LIMIT:10}
    login-ip-window-seconds: ${ADMIN_LOGIN_IP_WINDOW:60}
    # ④ 运维只读面。admin 作为独立进程（FULL）时手里没有任何业务模块的 MeterRegistry，只能抓别人；
    # 聚进 standalone 的那一档由该模块的 yml 覆成 local。
    # targets 是**正面清单**（host 与端口都限死，见 OpsTargets）：它是 ④ 唯一的 SSRF 面。
    # 清单来自配置而不是注册中心——"任何注册进来的服务都能被发现"本身就是问题，
    # 而 LITE/dev 根本没有 nacos。默认值对应本机进程形态（都在 127.0.0.1 上）；
    # 容器形态由 compose 覆写 OPS_T_*（那边主机名是 compose service 名）。
    ops:
      consistency-sample-size: ${OPS_CONSISTENCY_SAMPLE:20}
      targets:
        marketing-activity: ${OPS_T_ACTIVITY:127.0.0.1:8081}
        marketing-coupon: ${OPS_T_COUPON:127.0.0.1:8082}
        marketing-discount: ${OPS_T_DISCOUNT:127.0.0.1:8083}
        marketing-seckill: ${OPS_T_SECKILL:127.0.0.1:8084}
        marketing-gateway: ${OPS_T_GATEWAY:127.0.0.1:8090}
        self: ${OPS_T_SELF:127.0.0.1:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.marketing: INFO

---
spring:
  config:
    import: optional:nacos:marketing-admin.yaml
    activate:
      on-profile: nacos
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
