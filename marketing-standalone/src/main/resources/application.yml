# ============================================================
# 开发/预览环境形态：四业务模块单 JVM 聚合 + Redis Stream 消息
# 与正式环境（Full 拓扑）的差异只在本文件 + MQ_TYPE 环境变量，业务代码零改动
# ============================================================
server:
  port: 8085

spring:
  application:
    name: marketing-standalone
  datasource:
    # 单库：表结构见 docker/mysql/init-lite/01-schema-lite.sql
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DB:marketing}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:marketing}
    password: ${MYSQL_PASSWORD:marketing123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接预算的算法：一个 JVM 承载四模块 + 两个 Stream 消费线程 + 补偿 Job，
      # 而慢提交会让连接被持有到 fsync 完成。池=10 时实测 25 并发就打满
      # （hikaricp_connections_timeout_total 累加、请求在等连接上超时到 20s），
      # 是 LITE 常态服役的第一限制因子。30 与下面 MySQL max-connections=60 留一倍余量。
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: 4
  data:
    redis:
      # 命令超时 3s（2026-09-29 审查收口）：lettuce 默认 60s——Redis 抖动时每个请求
      # 最长挂一分钟而不是快速失败；库存/限流/幂等全压在 Redis 上，快速失败 + 降级
      # （网关 fail-open、预算回删）比长悬挂便宜得多
      timeout: ${REDIS_TIMEOUT_MS:3000}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        # local 模式整体关闭 nacos 配置客户端：否则它常驻一条 gRPC 重连线程，
        # 每 3s 刷一次 "Server check fail"，并把 /actuator/health 拖成 DOWN
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        import-check:
          enabled: false

mybatis-plus:
  # 这里刻意不配逻辑删除：所有表都没有 deleted 列，配了它只会让 deleteById 静默变成物理删除；
  # 下线语义一律走各自的 status（活动 OFFLINE/FINISHED、券模板 OFFLINE、规则 DISABLED）。
  global-config:
    banner: false

# 消息通道：Redis Stream 替代 RocketMQ（common 自动装配按此选型）
marketing:
  # 只保留真正存在形态差异 / 无代码默认的配置：mq.type（LITE 用 Redis Stream）与 admin（后台密钥）。
  # 灰度规则已移进 activity.gray_percent 列——它是数据，不是配置；
  # 在线配置的形态标识由 common 的嵌套占位统一读 DEPLOY_FORM，不在这里复制
  mq:
    type: ${MQ_TYPE:redis-stream}
  # 后台聚进本进程，所以 ADMIN_JWT_SECRET 必须在 standalone 与 gateway 两处同值下发；
  # 留空会让 AdminSecurityConfig 启动即失败（而不是默默签出一个谁都能伪造的 token）
  admin:
    jwt-secret: ${ADMIN_JWT_SECRET:}
    access-ttl-seconds: ${ADMIN_TOKEN_TTL:900}
    # ④：本档四个业务模块与后台都在这一个 JVM 里，它们的指标不必绕 HTTP；
    # 但网关仍是独立进程（母版事实 #2），所以清单里必须有它，且它走 proxy。
    # 清单不给全会怎样：LITE 的运维面读不到限流拒绝数，而单机服役档最该看的就是它。
    ops:
      # 本 JVM 里有的：self（四个业务模块 + 后台的指标全在这）。
      # 网关不在这里——它是独立进程，只能 HTTP 抓，所以留在 targets 里走 proxy。
      local-targets: [self]
      targets:
        self: 127.0.0.1:8085
        # 网关在 LITE 也是独立进程，只能抓它。默认 127.0.0.1 是 dev（本机两 JVM）的形状；
        # 预览容器形态由 compose 用 OPS_GATEWAY_HOST 覆成服务名——同机不同容器时
        # 127.0.0.1 指的是自己，那条读数会变成一条 ERROR 而不是假绿。
        # 端口 8091 = 网关独立管理端口（actuator），业务入口仍是 8090
        marketing-gateway: ${OPS_GATEWAY_HOST:127.0.0.1}:8091
  # 消费者账号同样聚进本进程：CONSUMER_JWT_SECRET 必须在 standalone 与 gateway 两处同值下发。
  # 属性只在 marketing-account 自己的 application.yml 里写不够 —— 一个应用只加载一份配置文件，
  # standalone 加载的是它自己那份。少了 marketing.account.jwt-secret 是启动即失败（响亮），
  # 少了 marketing.consumer.token-secret 则是条件 bean 安静地缺席，拖到第一个登录请求才炸。
  account:
    jwt-secret: ${CONSUMER_JWT_SECRET:}
    access-ttl-seconds: ${CONSUMER_TOKEN_TTL:900}
    refresh-ttl-seconds: ${CONSUMER_REFRESH_TTL:2592000}
    # 下面这些也必须在这里写一份：standalone 只加载它那一份 yml，marketing-account 自己的
    # application.yml 在 LITE 里根本不会被读。少一条不是报错，而是那些环境变量（CONSUMER_MAX_FAIL /
    # CONSUMER_LOGIN_IP_LIMIT / CONSUMER_REGISTER_IP_LIMIT …）在服役档静默失效 ——
    # 调了没反应，且没有任何地方告诉你没反应。与 consumer.token-secret 同一族坑。
    clock-skew-seconds: 30
    max-fail-count: ${CONSUMER_MAX_FAIL:5}
    lock-minutes: ${CONSUMER_LOCK_MINUTES:15}
    login-ip-limit: ${CONSUMER_LOGIN_IP_LIMIT:5}
    login-ip-window-seconds: ${CONSUMER_LOGIN_IP_WINDOW:60}
    register-ip-limit: ${CONSUMER_REGISTER_IP_LIMIT:10}
    register-ip-window-seconds: ${CONSUMER_REGISTER_IP_WINDOW:3600}
    max-active-sessions: ${CONSUMER_MAX_SESSIONS:10}
  consumer:
    token-secret: ${CONSUMER_JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  # W12：印网关注入的 traceId（无头直连时为空，日志照常）——跨服务排障的钥匙
  pattern:
    level: "%5p [${traceId:-}]"
  level:
    com.example.marketing: INFO
