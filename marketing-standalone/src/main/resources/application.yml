# ============================================================
# 开发/预览环境形态：四业务模块单 JVM 聚合 + Redis Stream 消息
# 与正式环境（Full 拓扑）的差异只在本文件 + MQ_TYPE 环境变量，业务代码零改动
# ============================================================
server:
  port: 8085

spring:
  application:
    name: marketing-standalone
  datasource:
    # 单库：表结构见 docker/mysql/init-lite/01-schema-lite.sql
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DB:marketing}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:marketing}
    password: ${MYSQL_PASSWORD:marketing123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接预算的算法：一个 JVM 承载四模块 + 两个 Stream 消费线程 + 补偿 Job，
      # 而慢提交会让连接被持有到 fsync 完成。池=10 时实测 25 并发就打满
      # （hikaricp_connections_timeout_total 累加、请求在等连接上超时到 20s），
      # 是 LITE 常态服役的第一限制因子。30 与下面 MySQL max-connections=60 留一倍余量。
      maximum-pool-size: ${DB_POOL_MAX:30}
      minimum-idle: 4
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        # local 模式整体关闭 nacos 配置客户端：否则它常驻一条 gRPC 重连线程，
        # 每 3s 刷一次 "Server check fail"，并把 /actuator/health 拖成 DOWN
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        import-check:
          enabled: false

mybatis-plus:
  # 这里刻意不配逻辑删除：所有表都没有 deleted 列，配了它只会让 deleteById 静默变成物理删除；
  # 下线语义一律走各自的 status（活动 OFFLINE/FINISHED、券模板 OFFLINE、规则 DISABLED）。
  global-config:
    banner: false

# 消息通道：Redis Stream 替代 RocketMQ（common 自动装配按此选型）
marketing:
  # 只保留真正存在形态差异 / 无代码默认的配置：mq.type（LITE 用 Redis Stream）与 admin（后台密钥）。
  # 灰度规则已移进 activity.gray_percent 列——它是数据，不是配置；
  # 在线配置的形态标识由 common 的嵌套占位统一读 DEPLOY_FORM，不在这里复制
  mq:
    type: ${MQ_TYPE:redis-stream}
  # 后台聚进本进程，所以 ADMIN_JWT_SECRET 必须在 standalone 与 gateway 两处同值下发；
  # 留空会让 AdminSecurityConfig 启动即失败（而不是默默签出一个谁都能伪造的 token）
  admin:
    jwt-secret: ${ADMIN_JWT_SECRET:}
    access-ttl-seconds: ${ADMIN_TOKEN_TTL:900}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.example.marketing: INFO
