server:
  port: 8087

spring:
  application:
    name: marketing-account
  datasource:
    # 与 admin 同构：默认第 6 个库（四库隔离档下是 MYSQL_DB 覆盖），
    # LITE/dev 单库档由 MYSQL_DB=marketing 覆盖，表并进业务库里（见 init-lite DDL）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DB:marketing_account}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:marketing}
    password: ${MYSQL_PASSWORD:marketing123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 登录/注册是人点出来的低频操作；与业务同进程时不给它抢池子的空间
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    redis:
      # 命令超时 3s（2026-09-29 审查收口）：lettuce 默认 60s——Redis 抖动时每个请求
      # 最长挂一分钟而不是快速失败；库存/限流/幂等全压在 Redis 上，快速失败 + 降级
      # （网关 fail-open、预算回删）比长悬挂便宜得多
      timeout: ${REDIS_TIMEOUT_MS:3000}
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      config:
        enabled: false
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        import-check:
          enabled: false

mybatis-plus:
  # 与业务模块一致：不配逻辑删除，所有表都没有 deleted 列。
  # 账号的"删除"语义是停用（status=DISABLED）与会话吊销，不是抹行 —— 券与订单要能追到人
  global-config:
    banner: false

marketing:
  account:
    # 必须与网关同值，且必须与 ADMIN_JWT_SECRET 是两个值（见 AccountProperties 的理由）
    jwt-secret: ${CONSUMER_JWT_SECRET:}
    access-ttl-seconds: ${CONSUMER_TOKEN_TTL:900}
    refresh-ttl-seconds: ${CONSUMER_REFRESH_TTL:2592000}
    clock-skew-seconds: 30
    max-fail-count: ${CONSUMER_MAX_FAIL:5}
    lock-minutes: ${CONSUMER_LOCK_MINUTES:15}
    login-ip-limit: ${CONSUMER_LOGIN_IP_LIMIT:5}
    login-ip-window-seconds: ${CONSUMER_LOGIN_IP_WINDOW:60}
    register-ip-limit: ${CONSUMER_REGISTER_IP_LIMIT:10}
    register-ip-window-seconds: ${CONSUMER_REGISTER_IP_WINDOW:3600}
    max-active-sessions: ${CONSUMER_MAX_SESSIONS:10}
  # 业务侧自验签件（本进程也要用它读 /api/auth/me 等端点）。
  # 声明了这个属性，ConsumerSecurityAutoConfiguration 才会建 bean —— 缺配即拒启。
  consumer:
    token-secret: ${CONSUMER_JWT_SECRET:}
    token-clock-skew-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  # W12：印网关注入的 traceId（无头直连时为空，日志照常）——跨服务排障的钥匙
  pattern:
    level: "%5p [${traceId:-}]"
  level:
    com.example.marketing: INFO

---
spring:
  config:
    import: optional:nacos:marketing-account.yaml
    activate:
      on-profile: nacos
  cloud:
    nacos:
      discovery:
        enabled: true
      config:
        enabled: true
