# marketing-web：前后端分离后的静态承载（nginx）
# 行为契约逐条复刻原 admin 侧 UiWebMvcConfig/H5WebMvcConfig + UiResourceSupport：
#   ① assets/ 下（文件名带内容指纹）→ 一年 immutable；缺失 404；
#   ② 任何静态后缀（.js/.css/…）缺失 → 404，绝不回退成 HTML（冒烟链路 8 的
#     --path-as-is 断言钉住这条——回退会让"缺文件"伪装成"白屏"）；
#   ③ 无后缀路径（SPA 深链 /ui/audits）→ 回退各自 index.html；索引页 no-store
#     （旧索引配上新指纹文件名 = 白屏）；
#   ④ 全部 /ui/*、/h5/* 带 CSP（与原 UiHeaderFilter 同值）；
#   ⑤ /api/** 到不了这里（网关只转发 /ui、/h5；直连 8088 仅 dev 回环）。
# 布局：COPY 到 /usr/share/nginx/html/{ui,h5}，配合 root 指令（不用 alias），
# location 前缀与文件路径天然一致。regex location 按声明序首个命中生效。

server {
    listen 80;
    server_name _;

    # 路径穿越兜底（网关 PathNormalizeGuardFilter 已挡 ../，这里再拒一层）
    if ($request_uri ~* "\.\.|%2e%2e") {
        return 400;
    }

    # ---------- ① assets/：内容指纹文件，一年 immutable，缺失 404 ----------
    location ~* ^/(ui|h5)/assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'";
    }

    # ---------- ② 其余静态后缀：存在才给、缺失 404（不回退） ----------
    # index.html 不在此列（无 .html 进后缀表）——它走 ③ 的前缀 location 拿 no-store。
    location ~* ^/(ui|h5)/.*\.(js|mjs|css|map|ico|svg|png|jpe?g|gif|webp|woff2?|ttf|json)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'";
    }

    # ---------- ③ 前缀兜底：SPA 深链回退 index.html，索引 no-store ----------
    location /ui/ {
        root /usr/share/nginx/html;
        try_files $uri /ui/index.html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'";
    }
    location /h5/ {
        root /usr/share/nginx/html;
        try_files $uri /h5/index.html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'";
    }
    location = /ui { return 302 /ui/; }
    location = /h5 { return 302 /h5/; }

    # 根路径给个去往 H5 的跳转（直连误访时有个可读落点；正常流量永远从网关来）
    location = / {
        return 302 /h5/;
    }

    # 其余一律 404（web 容器只有静态职责）
    location / {
        return 404;
    }
}
