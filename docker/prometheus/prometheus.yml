# Prometheus 采集配置：抓取四个业务服务 + 网关的 /actuator/prometheus
global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: marketing-local
    metrics_path: /actuator/prometheus
    static_configs:
      # 宿主机服务在容器视角下通过 host.docker.internal 访问（macOS/Windows Docker Desktop 原生支持；
      # Linux 需在 compose 中为 prometheus 增加 extra_hosts: ["host.docker.internal:host-gateway"]）
      - targets:
          - host.docker.internal:8090
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083
          - host.docker.internal:8084
        labels:
          env: local
