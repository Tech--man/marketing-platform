# ============================================================
# 告警规则（W13，2026-09-29 审查收口）
#   五批修复补齐了"该告警的指标"，这里把它们变成会响的规则。
#   前提：告警接收通道（Alertmanager webhook/邮件）是运维侧待定项——
#   规则先就位，接收器接上即生效。
#   抓取间隔 10s（prometheus.yml global），for 统一 2m 防抖。
# ============================================================
groups:
  - name: marketing-availability
    rules:
      - alert: GatewayRateLimitDegraded
        expr: increase(marketing_gateway_rate_limit_degraded_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "网关限流降级为 fail-open（Redis 计数不可用）"
          description: "限流键计数失败超过 5 分钟，入口回到无限流基线。检查 Redis 可用性。"

      - alert: GatewayAuthDegraded
        expr: increase(marketing_gateway_auth_degraded_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "网关鉴权降级为仅验签（Redis 吊销位不可用）"
          description: "已吊销 token 可用到自然过期（上界 accessTtl）。检查 Redis。"

  - name: marketing-consistency
    rules:
      - alert: LocalMessageDeadLetter
        expr: marketing_message_failed > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "本地消息表有 FAILED 死信"
          description: "补偿链路重试 10 次后放弃，需人工排查或经管理端 messages/redrive 重驱动。"

      - alert: AuditDrainDeferred
        expr: increase(marketing_audit_drain_deferred_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "审计落库失败在重试"
          description: "条目留在 PEL 由回收重试；持续失败说明 admin 的 MySQL 出问题，审计在积压。"

      - alert: PreDeductRollbackFailed
        expr: increase(coupon_grant_rollback_failed_total[10m]) > 0
        or increase(seckill_grab_compensate_failed_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "预扣归还失败（库存/预算残余差值）"
          description: "补偿动作自身失败，Redis 与权威值出现差值——④ 的 mismatch 面板核对后人工修复。"

      # N-7（2026-10-01 复审）：LITE Stream 通道拒投了不属于本 handler 的 tag——
      # 出现即说明两形态的 topic/tag 布局分叉（有人在已有 topic 上加了新 tag），
      # FULL 会按 tag 分给别的消费者而 LITE 直接丢弃。任何一次拒投都值得停下核对。
      - alert: StreamTagRejected
        expr: increase(stream_consumer_tag_rejected_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "LITE Stream 通道拒投了异 tag 消息（两形态 tag 布局分叉）"
          description: "MKT_* topic 上出现了消费端未声明的 tag：FULL 按 selectorExpression
            路由给别的消费者，LITE 拒投丢弃（本地消息表 30 轮后转 FAILED 死信）。
            立即核对该 topic 的发布方与两侧消费者的 tag 布局是否一致。"

      # N-6②（2026-10-01 复审）：回补去重 token 缺失——坏载荷分支的 requestId 可能为空，
      # 此类回补放弃去重直接执行（重投可能双还，方向偏松但有迹可循），持续出现说明
      # 调用方的 token 语义有缺口。
      - alert: RollbackWithoutToken
        expr: increase(coupon_grant_rollback_no_token_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "券回补在无去重 token 下执行"
          description: "invalidPayload 等路径的 requestId 缺失，回补退化为不去重模式。
            核对事件载荷里 requestId 的必填性（GrantRequest @Size/@Pattern 只拦请求侧）。"


  - name: marketing-hygiene
    rules:
      - alert: MessagePurgeBacklog
        expr: increase(marketing_message_purged_total[1h]) > 50000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "终态归档单小时删除超 5 万行"
          description: "终态行异常堆积或流量激增，核对是否需要调保留期或清理频率。
            W3.3 后归档已改为循环删空（单轮上限 50 万），该阈值恢复可达；持续触发
            说明确认速率远超预期，核对业务流量。"
      # W3 附（2026-09-30 第二轮复审）：抓取目标整体失联是最基本的可观测底线——
      # 此前六条规则全是业务指标，job 全 down（网络重建/目标进程死）时静默。
      # 只盯本项目的两个 job；形态切换时另一个 job 恒 down 属正常，所以按 job
      # 维度聚合（任一 job 全体 target 失联才响），而不是按单 target。
      - alert: ScrapeTargetDown
        expr: min(up{job=~"marketing-local|marketing-full-container"}) by (job) == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus 抓取 job {{ $labels.job }} 全部目标失联超过 3 分钟"
          description: "整个 job 的所有实例 up=0：目标进程死/网络不通/prometheus 配置漂移。
            先看是哪个形态的 job——另一形态恒 down 属正常，当前形态的 job 全 down 才是事故。"
