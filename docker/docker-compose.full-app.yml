# ============================================================
# FULL 扩容档 · 应用侧编排：5 个业务服务各自成容器，可 --scale 多副本
#   · 数据层（mysql/redis）与扩容档中间件（rocketmq/nacos/prometheus）不在本文件：
#     前者用 docker-compose.data.yml，后者用 docker-compose.prod.yml
#   · 必须走 nacos 服务发现：网关按 lb:// 负载均衡到各服务的多个副本，
#     因此本文件里的服务**不发布任何宿主机端口**（副本数无关端口冲突）
#   · broker 广播地址：RocketMQ 客户端连的是 broker 向 namesrv 广播的那个地址，而一台 broker
#     只能广播一个，两类客户端要的却不一样：
#       - 本机进程形态（scripts/start-all.sh）→ brokerIP1=127.0.0.1（rocketmq/broker.conf）
#       - 本文件的形态 → brokerIP1=host.docker.internal（rocketmq/broker.container.conf，
#         由 docker-compose.prod.container.yml 这层覆盖挂上）
#     实测依据（Apple Silicon + OrbStack）：容器内 host.docker.internal 可用；宿主机上原生
#     socket 也连得通它，但 JVM 里的 RocketMQ Netty 客户端连不通（RemotingConnectException）
#     —— 所以两侧不能共用一个取值。deploy-full.sh 每次都用覆盖层起中间件并显式重建 broker。
#   · 项目名固定 mkt-full：与中间件编排在同一目录，不命名会共用默认项目名 "docker"，
#     那时 compose 把 nacos/rocketmq 报成孤儿容器，带 --remove-orphans 的 down 会顺手拆掉中间件。
#   · 运维前置条件（实测踩过）：broker 所在分区使用率 > 90% 会以
#     CODE:14 service not available 拒写，表现和"链路坏了"一模一样。一次 --build
#     全量重建约多占 2 GB，磁盘紧张时用 SKIP_BUILD=1 复用现成镜像。
#   · 启动（需先 mvn package 产出各模块 fat jar）：
#       ./scripts/deploy-full.sh              构建并起全量（默认每服务 1 副本）
#       ./scripts/deploy-full.sh --scale marketing-discount=3
#       SKIP_BUILD=1 ./scripts/deploy-full.sh --scale marketing-seckill=2
# ============================================================
#   · 独立项目名 mkt-full：本文件与中间件编排在同一目录，若不命名会共用默认项目名
#     "docker"，于是 compose 把 nacos/rocketmq 当成孤儿容器告警，而带 --remove-orphans
#     的 down 会顺手把中间件拆了。网络仍走 external 的 mkt-data / mkt-mw，不受项目名影响。
name: mkt-full
x-app-defaults: &app-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  # mkt-data = 数据层所在网络（mysql/redis）；mkt-mw = 扩容档中间件网络（nacos/rocketmq）
  networks: [mkt-data, mkt-mw]
  environment: &app-env
    MYSQL_HOST: mkt-mysql
    MYSQL_PORT: "3306"
    MYSQL_DB: marketing          # 与 LITE 共用同一份数据 → 支持原地双向切换
    REDIS_HOST: mkt-redis
    REDIS_PORT: "6379"
    ROCKETMQ_ADDR: mkt-rocketmq-namesrv:9876
    NACOS_ADDR: mkt-nacos:8848
    SPRING_PROFILES_ACTIVE: nacos
    # 一容器一服务，全部继承同一个 form=FULL：扩容档的阈值只从 DB 的 GLOBAL/FULL 行取。
    # 锚点只写一次——五个服务 + 网关共用，避免复制出几份会互相漂移的形态标识
    DEPLOY_FORM: FULL
    # 后台 token 密钥：gateway 与 marketing-admin 都从这一个锚点继承，天然同值。
    # 用 :? 强制显式导出 —— 留空会让 AdminSecurityConfig 启动即失败，
    # 而"起不来"比"签出一个谁都能伪造的 admin token"好得多。
    # 空值不在这里拦：compose 的 :? 连 down/ps 都要求值，漏配时连"把栈停掉"都会失败。
    # 强制检查在 deploy-full.sh 的入口；真漏了就退化成"后台 40300 + admin 容器起不来"
    # （AdminSecurityConfig 空密钥直接抛），C 端流量不受牵连。
    ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
    JAVA_OPTS: "-Xmx512m -Xss512k -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"

services:
  marketing-activity:
    <<: *app-defaults
    build: { context: ../marketing-activity }
    image: marketing-activity:full

  marketing-coupon:
    <<: *app-defaults
    build: { context: ../marketing-coupon }
    image: marketing-coupon:full

  marketing-discount:
    <<: *app-defaults
    build: { context: ../marketing-discount }
    image: marketing-discount:full

  marketing-seckill:
    <<: *app-defaults
    build: { context: ../marketing-seckill }
    image: marketing-seckill:full

  marketing-admin:
    <<: *app-defaults
    build: { context: ../marketing-admin }
    image: marketing-admin:full
    # 不发布端口：后台只经 gateway 的 /api/admin/** 暴露。直连 8086 是一个已知边界 ——
    # 与四个业务服务同构（它们同样不校验 token，鉴权在网关），见 README 的"端口暴露"一节
    environment:
      <<: *app-env
      JAVA_OPTS: "-Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:+UseG1GC"

  marketing-gateway:
    <<: *app-defaults
    build: { context: ../marketing-gateway }
    image: marketing-gateway:full
    ports:
      - "8090:8090"     # 对外唯一入口
    environment:
      <<: *app-env
      # 容器形态走 nacos profile，后台路由是 lb://marketing-admin（按服务名发现），
      # 不需要 ADMIN_HOST/ADMIN_PORT —— 那两个只在 local profile 下生效（LITE 用）
      # 网关自己也要注册进 nacos，才能按服务名 lb:// 发现四个业务服务的副本
      JAVA_OPTS: "-Xmx256m -Xss512k -XX:MaxMetaspaceSize=192m -XX:+UseG1GC"

networks:
  mkt-data:
    external: true
  # 扩容档中间件（docker-compose.prod.yml）的默认网络
  mkt-mw:
    external: true
    name: docker_default
