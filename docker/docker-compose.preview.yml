# ============================================================
# LITE 服役档（preview）：应用侧全栈容器化 —— 四业务模块单 JVM 聚合 + 网关，共 2 个 JVM
#   · 定位：非活跃期 7×24 常态服役，小机器真跑流量，不是演示环境
#   · 数据层不在本文件里：MySQL/Redis 由 docker-compose.data.yml 常驻提供，
#     本形态只是接入同一个网络 —— 这正是"同一份数据原地升档到 FULL"的前提
#   · 内存：实测整机 ≈ 1.0 GiB（JVM 小堆 + G1 + mem_limit 留余量）
#   · 消息：Redis Stream 替代 RocketMQ；无 Nacos（网关静态路由）；无 Prometheus
# 启动：./scripts/deploy-preview.sh（会自动把数据层拉起来）
# ============================================================
# 容器日志必须轮转：默认 json-file 不限量，常态服役下会撑爆磁盘
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  standalone:
    build:
      context: ../marketing-standalone
    image: marketing-standalone:preview
    container_name: mkt-preview-standalone
    # 数据层常驻，不在本编排内：跨 compose 项目用 external 网络按容器名访问
    networks: [mkt-data]
    environment:
      MYSQL_HOST: mkt-mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: marketing
      REDIS_HOST: mkt-redis
      # 预览形态消息通道：Redis Stream 替代 RocketMQ
      MQ_TYPE: redis-stream
      # 消费并行度：与 Full 形态 @RocketMQMessageListener(consumeThreadNumber=8) 对齐。
      # 默认 1 worker 时实测消费净速率只有 ~24 msg/s（单线程 × 每条 2-3 次提交等 fsync），
      # 这既是吞吐墙也是两形态行为不等价，故显式可调：宿主机 MQ_STREAM_CONCURRENCY 覆盖
      MARKETING_MQ_STREAM_CONCURRENCY: ${MQ_STREAM_CONCURRENCY:-8}
      # 320M 堆够四个模块低峰承载；GC 用 G1 而非 SerialGC —— SerialGC 的 Full GC 会把
      # 结算线程全停，"小机器常态服役"下这是可见的业务抖动。mem_limit 按
      # 堆 320 + 元空间 160 + code cache/线程栈/direct ~150 给足余量，避免容器 OOMKill。
      JAVA_OPTS: "-Xmx320m -Xss512k -XX:MaxMetaspaceSize=160m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    ports:
      - "8085:8085"   # 调试用；对外只暴露网关
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8085'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    mem_limit: 768m
    logging: *log

  gateway:
    build:
      context: ../marketing-gateway
    image: marketing-gateway:preview
    container_name: mkt-preview-gateway
    depends_on:
      standalone:
        condition: service_healthy
    networks: [mkt-data]
    environment:
      REDIS_HOST: mkt-redis
      # 四条路由统一指向 standalone（复用 prod 形态网关，仅改端口变量）
      ACTIVITY_HOST: standalone
      ACTIVITY_PORT: "8085"
      COUPON_HOST: standalone
      COUPON_PORT: "8085"
      DISCOUNT_HOST: standalone
      DISCOUNT_PORT: "8085"
      SECKILL_HOST: standalone
      SECKILL_PORT: "8085"
      JAVA_OPTS: "-Xmx192m -Xss512k -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      # 入口阈值随形态收口：与实测排空能力（108-142 msg/s/topic）对齐，
      # 纯同步的优惠计算给到 500/s 不影响（单次 ~0.4ms）
      RL_COUPON: "120"
      RL_SECKILL: "120"
      RL_ACTIVITY: "200"
      RL_DISCOUNT: "500"
    ports:
      - "8090:8090"   # 对外唯一入口（服务器可映射 80:8090）
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    mem_limit: 448m
    logging: *log

networks:
  mkt-data:
    external: true
