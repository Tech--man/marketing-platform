# ============================================================
# 预览环境（preview）：全栈容器化，单镜像聚合 + 网关，共 2 个 JVM
#   · 定位：给他人点开就能点的功能预览 / 演示环境，不做压测、不接生产流量
#   · 内存：极致小。JVM 堆 + 元空间按"够用"给定并配 mem_limit 硬上限，
#     整栈上限 1.15G（mysql 512 + redis 128 + standalone 512 + gateway 320 中的
#     应用部分 832M），2C4G 机器可与其它服务共存
#   · 消息：Redis Stream 替代 RocketMQ；无 Nacos（网关静态路由）；无 Prometheus
#   · 库：单库 marketing（docker/mysql/init-lite）
# 与 prod 形态（docker-compose.prod.yml）端口冲突，切换前先 down 掉另一套
# ============================================================
services:
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    container_name: mkt-preview-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: marketing
      MYSQL_USER: marketing
      MYSQL_PASSWORD: marketing123
    # 不对宿主机发布：预览栈自给自足，容器网络内按服务名访问，避免与 dev/prod 抢端口
    volumes:
      - mkt-preview-mysql-data:/var/lib/mysql
      # 单库初始化脚本（4 库合并版，种子数据一致）
      - ./mysql/init-lite:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # 小内存调参：缓冲池 64M，关掉 performance_schema / binlog / 连接与表缓存
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --skip-log-bin
      - --max-connections=60
      - --table-open-cache=400
      - --table-definition-cache=400
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: mkt-preview-redis
    # 关闭持久化：预览环境重启即重新预热，省掉 RDB fork 的额外内存
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  standalone:
    build:
      context: ../marketing-standalone
    image: marketing-standalone:preview
    container_name: mkt-preview-standalone
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: marketing
      REDIS_HOST: redis
      # 预览形态消息通道：Redis Stream 替代 RocketMQ
      MQ_TYPE: redis-stream
      # 320M 堆够四个模块的空载与冒烟并发；TieredStopAtLevel=1 只跑 C1，
      # 换取更快的启动与更小的 code cache（预览环境不追求峰值吞吐）
      JAVA_OPTS: "-Xmx320m -Xss512k -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    ports:
      - "8085:8085"   # 调试用；对外只暴露网关
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8085'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 512m

  gateway:
    build:
      context: ../marketing-gateway
    image: marketing-gateway:preview
    container_name: mkt-preview-gateway
    depends_on:
      standalone:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      # 四条路由统一指向 standalone（复用 prod 形态网关，仅改端口变量）
      ACTIVITY_HOST: standalone
      ACTIVITY_PORT: "8085"
      COUPON_HOST: standalone
      COUPON_PORT: "8085"
      DISCOUNT_HOST: standalone
      DISCOUNT_PORT: "8085"
      SECKILL_HOST: standalone
      SECKILL_PORT: "8085"
      JAVA_OPTS: "-Xmx192m -Xss512k -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    ports:
      - "8090:8090"   # 对外唯一入口（服务器可映射 80:8090）
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 320m

volumes:
  mkt-preview-mysql-data:
