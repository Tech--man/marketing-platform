# RocketMQ broker 本地开发配置
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# broker 只广播一个地址，而两类客户端都要能解析它：
#   · 本机进程形态（scripts/start-all.sh）→ 需要指向宿主机
#   · 容器化形态（scripts/deploy-full.sh）→ 容器内的 127.0.0.1 是它自己，拿不到宿主机
# host.docker.internal 在 Docker Desktop / OrbStack 下**容器内和宿主机上都能解析**
# （宿主机侧由 fake-IP 解析到本机 published 端口），是两者唯一的公共取值。
brokerIP1 = host.docker.internal
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 脚手架演示：自动建 topic，免去手工 mqadmin 创建
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
