# RocketMQ broker 本地开发配置
#
# broker 只向 namesrv 广播**一个** brokerIP1，而 FULL 的两种交付形态需要的地址不同：
#   · 本机进程形态（scripts/start-all.sh）→ 业务进程在宿主机上，要 127.0.0.1；
#   · 容器化形态（scripts/deploy-full.sh）→ 容器内的 127.0.0.1 是它自己，
#     要 broker.container.conf（广播 host.docker.internal）。
# 实测依据（Apple Silicon + OrbStack）：容器侧 host.docker.internal 可用；宿主机上
# python/原生 socket 连 host.docker.internal:10911 也通，但 JVM 里的 RocketMQ Netty
# 客户端连不通（RemotingConnectException）—— 所以不能指望一个取值同时服务两侧。
# 两个 compose 文件各挂各自的那份，启动脚本负责调和，见 docker-compose.prod{,.container}.yml。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = 127.0.0.1
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 脚手架演示：自动建 topic，免去手工 mqadmin 创建
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
