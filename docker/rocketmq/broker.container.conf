# 与 broker.conf 只差 brokerIP1 一行（RocketMQ 的 conf 不支持 include/环境变量替换，
# 所以只能两份并排放着；改动其它项时两边同步）。
# 面向**容器化 FULL**（scripts/deploy-full.sh）：应用容器在宿主机之外，广播 127.0.0.1
# 会让它们连到各自容器内；host.docker.internal 是容器侧可达的地址（实测 34/34 + 多副本）。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = host.docker.internal
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
