# ============================================================
# 正式环境（prod）中间件编排：MySQL 四业务库 + Redis + RocketMQ + Nacos + Prometheus
#   · 定位：与生产同构的全链路（MQ 削峰、注册发现、指标抓取），业务服务
#     以 5 个独立进程运行（./scripts/start-all.sh），每个进程可独立扩缩容
#   · 内存：不做极限压缩，按吞吐配；建议 8C16G 起
#   · 与 dev 形态共用宿主机端口（mysql 3307 / redis 6380 / 网关 8090），两套互斥；
#     preview 形态不占用宿主机中间件端口
# 启动：docker compose -f docker-compose.prod.yml up -d（在本目录执行，
#       或 cd docker && docker compose up -d 走默认解析）
# ============================================================
services:
  # MySQL 与 Redis 属于常驻数据层（docker-compose.data.yml），本形态只补扩容档专属中间件
  rocketmq-namesrv:
    image: apache/rocketmq:5.2.0
    platform: linux/amd64
    container_name: mkt-rocketmq-namesrv
    ports:
      - "9876:9876"
    # mqnamesrv 不认 JAVA_MIN_MEM/JAVA_MAX_MEM（镜像里只透传 JAVA_OPT_EXT），
    # 不给定则按容器内存的 1/4 取堆（实测 2G）
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    command: ["sh", "mqnamesrv"]
    healthcheck:
      test: ["CMD-SHELL", "jps | grep -c NamesrvStartup || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  rocketmq-broker:
    image: apache/rocketmq:5.2.0
    platform: linux/amd64
    container_name: mkt-rocketmq-broker
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # 同上：broker 也走 JAVA_OPT_EXT，实测不给定时吃 2G 堆
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    # brokerIP1 指向宿主机回环：业务服务在本机（容器外）以 127.0.0.1:9876 直连
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
    command: ["sh", "mqbroker", "-c", "/home/rocketmq/broker.conf"]
    healthcheck:
      test: ["CMD-SHELL", "jps | grep -c BrokerStartup || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  nacos:
    image: nacos/nacos-server:v2.3.2
    platform: linux/amd64
    container_name: mkt-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "false"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: mkt-prometheus
    ports:
      - "9091:9090"   # 宿主机 9090 常被占用，改用 9091
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

